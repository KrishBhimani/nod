name: sidekick-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sidekick
      POSTGRES_PASSWORD: sidekick-local
      POSTGRES_DB: sidekick
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sidekick']
      interval: 2s
      timeout: 3s
      retries: 30
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    container_name: sidekick-workspace
    network_mode: none
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./.local/workspaces:/workspace
    tmpfs:
      - /tmp:size=256m
    command: ['sleep', 'infinity']
volumes:
  postgres-data:
