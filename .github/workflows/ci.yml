name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidekick
          POSTGRES_PASSWORD: sidekick-ci
          POSTGRES_DB: sidekick_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidekick -d sidekick_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://sidekick:sidekick-ci@127.0.0.1:5432/sidekick_ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, boundaries and formatting
        run: npm run check
      - name: Run all tests with PostgreSQL fixtures
        run: npm run test:integration
      - name: Build the client
        run: npm run build
      - name: Install Cloudflare adapter dependencies
        run: npm --prefix deployment/cloudflare ci
      - name: Check Cloudflare adapter types and fixtures
        run: |
          npm --prefix deployment/cloudflare run check
          npm --prefix deployment/cloudflare test
      - name: Validate both Cloudflare deployment bundles
        working-directory: deployment/cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler deploy --env development --dry-run --containers-rollout=none
          npx wrangler deploy --env production --dry-run --containers-rollout=none
      - name: Build the production Node image
        run: docker build --platform linux/amd64 --file deployment/cloudflare/Dockerfile --tag sidekick-ci .
      - name: Verify the container filesystem and user
        run: >-
          docker run --rm --network none --entrypoint node sidekick-ci
          -e 'const fs=require("node:fs");if(process.getuid()===0||fs.existsSync("/app/.env")||fs.existsSync("/app/.local")||!fs.existsSync("/app/dist/web/index.html"))process.exit(1)'

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
      - name: Verify the SQL exception still detects secrets
        run: python3 .github/scripts/check-secret-config.py "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts=--all .'
      - name: Scan the checked-out files
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .'
